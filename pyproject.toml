[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "A small pure-Python library of validation and normalization helpers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
]

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
